<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>비용관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#F6F7F9;
    --surface:#FFFFFF;
    --surface-alt:#F0F1F4;
    --ink:#171A21;
    --ink-soft:#5B6270;
    --ink-faint:#9AA0AC;
    --border:#E3E5EA;
    --accent:#3D5A80;
    --accent-soft:#EAF0F7;
    --accent-deep:#2C4560;
    --danger:#C6595F;
    --profit:#2E7D5B;
    --expense:#B4562B;
    --radius-lg:16px;
    --radius-md:10px;
    --shadow-card:0 1px 2px rgba(23,26,33,0.04);
    --shadow-pop:0 12px 32px rgba(23,26,33,0.12), 0 2px 8px rgba(23,26,33,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans KR','IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .app{
    max-width:640px;
    margin:0 auto;
    padding:24px 18px 50px;
  }
  @media (max-width:520px){
    .app{ padding:14px 8px 32px; }
  }

  /* topbar */
  .topbar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom:18px;
    gap:12px;
  }
  .brand{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:27px;
    letter-spacing:-0.02em;
  }
  #userBadge{
    font-size:14px;
    color:var(--ink-faint);
    margin-top:4px;
  }
  #configBanner{
    display:none;
    background:#FCEBE3;
    border:1px solid #E8734A;
    color:#8A3F1E;
    border-radius:10px;
    padding:12px 16px;
    font-size:14.5px;
    margin-bottom:16px;
    line-height:1.6;
  }

  /* calendar card */
  .cal-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:18px 18px 12px;
    box-shadow:var(--shadow-card);
    overflow-x:hidden;
    box-sizing:border-box;
    width:100%;
  }
  @media (max-width:520px){
    .cal-card{ padding:12px 8px 8px; border-radius:12px; }
  }
  .cal-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .cal-month{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:25px;
    letter-spacing:-0.01em;
  }
  .cal-month .yr{
    color:var(--ink-faint);
    font-weight:500;
    font-size:19px;
    margin-left:6px;
  }
  .nav-btns{display:flex;gap:8px;align-items:center;}
  .icon-btn{
    width:42px;height:42px;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:19px;
  }
  .icon-btn:hover{background:var(--surface-alt); color:var(--ink);}
  .today-btn{
    font-size:15.5px;
    font-weight:600;
    border:1px solid var(--border);
    background:var(--surface);
    border-radius:9px;
    padding:0 16px;
    height:42px;
    cursor:pointer;
    color:var(--ink-soft);
    font-family:'IBM Plex Sans KR',sans-serif;
  }
  .today-btn:hover{background:var(--surface-alt); color:var(--ink);}

  .month-total-bar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    background:var(--accent-soft);
    border-radius:11px;
    padding:14px 16px;
  }
  .month-stat{ min-width:0; }
  .month-total-label{
    font-size:13.5px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .month-total-value{
    font-family:'IBM Plex Mono',monospace;
    font-size:23px;
    font-weight:800;
    color:var(--accent-deep);
    margin-top:3px;
  }
  @media (max-width:400px){
    .month-total-value{ font-size:19px; }
  }
  .month-total-count{
    font-size:13px;
    color:var(--ink-faint);
  }

  .weekdays{ display:block; margin-bottom:4px; width:100%; }
  .weekdays-row{ display:table; width:100%; table-layout:fixed; }
  .weekdays-row div{
    display:table-cell;
    text-align:center;
    font-size:14.5px;
    color:var(--ink-faint);
    padding-bottom:10px;
    font-weight:600;
  }
  .weekdays-row div:first-child{color:#C6595F;}
  .weekdays-row div:last-child{color:#3D6FA3;}

  .grid{
    display:table;
    width:100%;
    table-layout:fixed;
    border-collapse:separate;
    border-spacing:4px;
  }
  @media (max-width:520px){
    .grid{ border-spacing:2px; }
  }
  .grid-row{ display:table-row; }
  .cell{
    display:table-cell;
    position:relative;
    height:72px;
    vertical-align:top;
    border-radius:9px;
    padding:8px 6px;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .12s, border-color .12s;
    overflow:hidden;
  }
  @media (max-width:520px){
    .cell{ height:58px; padding:6px 3px; border-radius:7px; }
  }
  .cell:hover{background:var(--surface-alt);}
  .cell.other-month{opacity:0.3;}
  .cell.is-today{ background:#FBF3E7; }
  .cell.is-today .cell-date{ color:#96712F; font-weight:700; }
  .cell-date{
    font-family:'IBM Plex Mono',monospace;
    font-size:16px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .cell-cost{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    font-weight:700;
    color:var(--accent-deep);
    margin-top:5px;
    line-height:1.3;
    word-break:break-all;
  }
  @media (max-width:520px){
    .cell-date{ font-size:13px; }
    .cell-cost{ font-size:10px; margin-top:3px; }
  }

  .footnote{
    font-size:13px;
    color:var(--ink-faint);
    text-align:center;
    margin-top:22px;
    line-height:1.7;
  }

  /* overlay / modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(23,26,33,0.32);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
    padding:16px;
  }
  .modal{
    background:var(--surface);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-pop);
    width:100%;
    max-width:420px;
    padding:22px;
    max-height:88vh;
    overflow-y:auto;
    position:relative;
  }
  .modal-close-x{
    position:absolute;
    top:14px; right:14px;
    width:38px;height:38px;
    border-radius:50%;
    border:none;
    background:var(--surface-alt);
    color:var(--ink-soft);
    font-size:20px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .modal-close-x:hover{background:var(--border); color:var(--ink);}
  .modal h3{
    font-family:'Manrope',sans-serif;
    font-size:21px;
    margin:0 0 6px;
  }
  .modal-sub{
    font-size:15px;
    color:var(--ink-faint);
    margin-bottom:18px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:15px;
    color:var(--ink-soft);
    margin-bottom:7px;
    font-weight:600;
  }
  .field input{
    width:100%;
    border:1px solid var(--border);
    border-radius:9px;
    padding:13px 14px;
    font-size:18px;
    font-family:'IBM Plex Sans KR',sans-serif;
    background:var(--surface);
    color:var(--ink);
  }
  .mat-row{ display:flex; align-items:center; gap:10px; }
  .mat-row input{ width:120px; flex-shrink:0; }
  .mat-row span{ font-size:16px; color:var(--ink-soft); white-space:nowrap; }

  .total-box{
    background:var(--accent-soft);
    border-radius:10px;
    padding:14px 16px;
    margin:18px 0 6px;
  }
  .total-box-label{ font-size:14.5px; color:var(--ink-soft); }
  .total-box-value{
    font-family:'IBM Plex Mono',monospace;
    font-size:28px;
    font-weight:800;
    color:var(--accent-deep);
    margin-top:3px;
  }

  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .btn-cancel, .btn-save{
    flex:1;
    border-radius:10px;
    padding:14px 0;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    border:none;
    font-family:'IBM Plex Sans KR',sans-serif;
  }
  .btn-cancel{ background:var(--surface-alt); color:var(--ink-soft); }
  .btn-save{ background:var(--accent); color:#fff; }
  .btn-save:hover{background:var(--accent-deep);}
  .btn-save:disabled{opacity:0.6; cursor:default;}

  .add-btn{
    width:100%;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:11px;
    padding:15px 0;
    font-size:17px;
    font-weight:700;
    font-family:'IBM Plex Sans KR',sans-serif;
    cursor:pointer;
  }
  .add-btn:hover{background:var(--accent-deep);}

  /* day entry list */
  .entry-item{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    padding:14px 10px;
    margin:0 -10px;
    border-bottom:1px solid var(--border);
    border-radius:8px;
    cursor:pointer;
    transition:background .12s;
  }
  .entry-item:hover{background:var(--surface-alt);}
  .entry-item:last-child{border-bottom:none;}
  .entry-main{font-size:16px; color:var(--ink); line-height:1.5; font-weight:500;}
  .entry-sub{font-size:13.5px; color:var(--ink-faint); margin-top:3px;}
  .entry-total{
    font-family:'IBM Plex Mono',monospace;
    font-size:17px;
    font-weight:700;
    color:var(--accent-deep);
    white-space:nowrap;
  }
  .entry-del{
    background:none; border:none; color:var(--ink-faint);
    font-size:22px; cursor:pointer; padding:2px 6px; line-height:1;
    margin-left:4px;
  }
  .entry-del:hover{color:var(--danger);}
  .empty-msg{
    font-size:16px;
    color:var(--ink-faint);
    text-align:center;
    padding:26px 0;
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="app">
  <div id="configBanner"></div>
  <div class="topbar">
    <div>
      <div class="brand">비용관리</div>
      <div id="userBadge"></div>
    </div>
  </div>

  <div class="cal-card">
    <div class="cal-nav">
      <div class="cal-month"><span id="monthLabel"></span><span class="yr" id="yearLabel"></span></div>
      <div class="nav-btns">
        <button class="today-btn" id="todayBtn">오늘</button>
        <button class="icon-btn" id="prevBtn">‹</button>
        <button class="icon-btn" id="nextBtn">›</button>
      </div>
    </div>

    <div class="month-total-bar">
      <div class="month-stat">
        <div class="month-total-label">이번 달 총 비용</div>
        <div class="month-total-value mono" id="monthTotalValue">0원</div>
      </div>
      <div class="month-stat" style="text-align:right;">
        <div class="month-total-label">이번 달 순이익</div>
        <div class="month-total-value mono" id="monthNetProfitValue" style="color:var(--profit);">0원</div>
      </div>
    </div>
    <div class="month-total-count" id="monthTotalCount" style="margin:-8px 0 16px; text-align:center;">0건</div>

    <div class="weekdays">
      <div class="weekdays-row"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    </div>
    <div class="grid" id="calGrid"></div>
  </div>

  <div class="footnote">날짜를 누르면 그날의 비용을 등록하거나 확인할 수 있어요. 데이터는 Firebase에 저장되고 접속한 모든 사람에게 실시간으로 공유돼요.</div>
</div>

<!-- 하루 상세: 등록된 비용 목록 + 추가 버튼 -->
<div class="overlay" id="dayOverlay" style="display:none;">
  <div class="modal">
    <button type="button" class="modal-close-x" id="dayCloseX">×</button>
    <h3 id="dayTitle">-</h3>
    <div class="modal-sub" id="daySubTotal">이 날 총 비용 0원</div>
    <div id="dayEntryList"></div>
    <button type="button" class="add-btn" id="dayAddBtn" style="margin-top:14px;">+ 비용 추가</button>
  </div>
</div>

<!-- 비용 추가/수정 -->
<div class="overlay" id="costOverlay" style="display:none;">
  <div class="modal">
    <button type="button" class="modal-close-x" id="costCloseX">×</button>
    <h3 id="costModalTitle">비용 추가</h3>
    <div class="modal-sub" id="costModalDate">-</div>

    <div class="field">
      <label for="inpMatQty">상상매트</label>
      <div class="mat-row">
        <input id="inpMatQty" type="number" min="0" step="1" value="0">
        <span>장 × 2,200원</span>
      </div>
    </div>
    <div class="field">
      <label for="inpInstallFee">시공비</label>
      <input id="inpInstallFee" type="number" min="0" step="1000" value="150000">
    </div>

    <div class="total-box">
      <div class="total-box-label">매출 합계</div>
      <div class="total-box-value mono" id="costTotalDisplay">150,000원</div>
    </div>

    <div class="field" style="margin-top:18px;">
      <label for="inpFuelCost">주유비</label>
      <input id="inpFuelCost" type="number" min="0" step="1000" value="0">
    </div>
    <div class="field">
      <label for="inpMiscCost">기타 부대비용</label>
      <input id="inpMiscCost" type="number" min="0" step="1000" value="0">
    </div>

    <div class="total-box" style="background:#EAF4EE;">
      <div class="total-box-label">순이익 (매출 − 주유비 − 기타)</div>
      <div class="total-box-value mono" id="netProfitDisplay" style="color:var(--profit);">150,000원</div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" id="costCancelBtn">취소</button>
      <button class="btn-save" id="costSaveBtn">저장</button>
    </div>
  </div>
</div>

<!-- 로그인 / 가입 -->
<div class="overlay" id="nameOverlay" style="display:none;">
  <div class="modal" style="text-align:center;">
    <div id="loginView">
      <h3 style="margin-bottom:6px;">비밀번호 입력</h3>
      <div class="modal-sub">4자리 비밀번호를 입력해주세요</div>
      <input id="loginPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" style="text-align:center; font-size:30px; letter-spacing:14px; padding:14px; width:100%; box-sizing:border-box; border:1px solid var(--border); border-radius:9px; font-family:'IBM Plex Mono',monospace;">
      <div id="loginError" style="color:var(--danger); font-size:14px; margin-top:8px; min-height:18px;"></div>
      <button type="button" id="loginSubmitBtn" class="add-btn" style="margin-top:10px;">입장하기</button>
      <div style="margin-top:16px; font-size:15px;">
        <a href="#" id="gotoSignupLink" style="color:var(--accent);">처음이세요? 가입하기</a>
      </div>
    </div>
    <div id="signupView" style="display:none;">
      <h3 style="margin-bottom:6px;">가입하기</h3>
      <div class="modal-sub">이름과 사용할 4자리 비밀번호를 정해주세요</div>
      <div style="text-align:left; font-size:15px; color:var(--ink-soft); margin-bottom:6px; font-weight:600;">이름</div>
      <input id="signupName" type="text" maxlength="20" style="width:100%; box-sizing:border-box; border:1px solid var(--border); border-radius:9px; padding:13px; margin-bottom:12px; font-size:18px; font-family:'IBM Plex Sans KR',sans-serif;">
      <input id="signupPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" style="text-align:center; font-size:30px; letter-spacing:14px; padding:14px; width:100%; box-sizing:border-box; border:1px solid var(--border); border-radius:9px; font-family:'IBM Plex Mono',monospace;">
      <div id="signupError" style="color:var(--danger); font-size:14px; margin-top:8px; min-height:18px;"></div>
      <button type="button" id="signupSubmitBtn" class="add-btn" style="margin-top:10px;">가입하고 시작하기</button>
      <div style="margin-top:16px; font-size:15px;">
        <a href="#" id="gotoLoginLink" style="color:var(--accent);">이미 가입했어요, 로그인</a>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  // ===== Firebase 설정 =====
  const firebaseConfig = {
    apiKey: "AIzaSyAMG9CVAYNponSWftSrTvaarvGcmipqSWg",
    authDomain: "scheduleapp-448f7.firebaseapp.com",
    projectId: "scheduleapp-448f7",
    storageBucket: "scheduleapp-448f7.firebasestorage.app",
    messagingSenderId: "399466089160",
    appId: "1:399466089160:web:aa80f4762112eb7fb933fd"
  };
  const MAT_UNIT_PRICE = 2200;

  let db = null;
  let fbReady = false;
  function showConfigBanner(msg){
    const el = document.getElementById('configBanner');
    el.style.display = 'block';
    el.textContent = msg;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    fbReady = true;
  }catch(e){
    fbReady = false;
    showConfigBanner('⚠️ Firebase 연결에 실패했어요. 잠시 후 새로고침해주세요.');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ===== 로그인 / 가입 =====
  let myName = '';
  let myMemberId = '';
  try{
    myName = localStorage.getItem('costAppUserName') || '';
    myMemberId = localStorage.getItem('costAppMemberId') || '';
  }catch(e){}

  function updateUserBadge(){
    const badge = document.getElementById('userBadge');
    if(myName){
      badge.innerHTML = `${escapeHtml(myName)}님 · <a href="#" id="switchNameLink" style="color:var(--accent);">전환</a> · <a href="#" id="deleteAccountLink" style="color:var(--danger);">계정삭제</a>`;
      document.getElementById('switchNameLink').addEventListener('click', (e)=>{
        e.preventDefault();
        showLoginView();
        document.getElementById('nameOverlay').style.display = 'flex';
      });
      document.getElementById('deleteAccountLink').addEventListener('click', (e)=>{
        e.preventDefault();
        deleteAccount();
      });
    }else{
      badge.textContent = '';
    }
  }

  async function deleteAccount(){
    if(!myMemberId){
      alert('계정 정보를 찾을 수 없어요. 다시 로그인한 뒤 시도해주세요.');
      return;
    }
    if(!confirm(`정말 '${myName}' 계정을 삭제할까요?\n비밀번호로 다시 로그인할 수 없게 되고, 이 작업은 되돌릴 수 없어요.`)) return;
    try{
      await db.collection('members').doc(myMemberId).delete();
      myName = '';
      myMemberId = '';
      try{
        localStorage.removeItem('costAppUserName');
        localStorage.removeItem('costAppMemberId');
      }catch(e){}
      updateUserBadge();
      showLoginView();
      document.getElementById('nameOverlay').style.display = 'flex';
    }catch(e){
      console.error(e);
      alert('계정 삭제 중 오류가 발생했어요.');
    }
  }

  function showLoginView(){
    document.getElementById('loginView').style.display = 'block';
    document.getElementById('signupView').style.display = 'none';
    document.getElementById('loginError').textContent = '';
    document.getElementById('loginPin').value = '';
    setTimeout(()=>document.getElementById('loginPin').focus(), 50);
  }
  function showSignupView(){
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('signupView').style.display = 'block';
    document.getElementById('signupError').textContent = '';
    document.getElementById('signupName').value = '';
    document.getElementById('signupPin').value = '';
    setTimeout(()=>document.getElementById('signupName').focus(), 50);
  }
  document.getElementById('gotoSignupLink').addEventListener('click', (e)=>{ e.preventDefault(); showSignupView(); });
  document.getElementById('gotoLoginLink').addEventListener('click', (e)=>{ e.preventDefault(); showLoginView(); });

  async function attemptLogin(){
    const pin = document.getElementById('loginPin').value.trim();
    const errEl = document.getElementById('loginError');
    if(!/^\d{4}$/.test(pin)){
      errEl.textContent = '4자리 숫자를 입력해주세요.';
      return;
    }
    if(!fbReady){ errEl.textContent = 'Firebase 연결 후 이용할 수 있어요.'; return; }
    errEl.textContent = '';
    try{
      const snap = await db.collection('members').where('pin','==',pin).limit(1).get();
      if(snap.empty){
        errEl.textContent = '비밀번호가 일치하는 계정이 없어요.';
        return;
      }
      myName = snap.docs[0].data().name;
      myMemberId = snap.docs[0].id;
      try{
        localStorage.setItem('costAppUserName', myName);
        localStorage.setItem('costAppMemberId', myMemberId);
      }catch(e){}
      document.getElementById('nameOverlay').style.display = 'none';
      updateUserBadge();
    }catch(e){
      console.error(e);
      errEl.textContent = '로그인 중 오류가 발생했어요.';
    }
  }
  document.getElementById('loginSubmitBtn').addEventListener('click', attemptLogin);
  document.getElementById('loginPin').addEventListener('keydown', (e)=>{ if(e.key==='Enter') attemptLogin(); });

  async function attemptSignup(){
    const name = document.getElementById('signupName').value.trim();
    const pin = document.getElementById('signupPin').value.trim();
    const errEl = document.getElementById('signupError');
    if(!name){ errEl.textContent = '이름을 입력해주세요.'; return; }
    if(!/^\d{4}$/.test(pin)){ errEl.textContent = '비밀번호는 숫자 4자리여야 해요.'; return; }
    if(!fbReady){ errEl.textContent = 'Firebase 연결 후 이용할 수 있어요.'; return; }
    errEl.textContent = '';
    try{
      const dupSnap = await db.collection('members').where('pin','==',pin).limit(1).get();
      if(!dupSnap.empty){
        errEl.textContent = '이미 사용 중인 비밀번호예요. 다른 번호로 정해주세요.';
        return;
      }
      const docRef = await db.collection('members').add({ name, pin, createdAt: Date.now() });
      myName = name;
      myMemberId = docRef.id;
      try{
        localStorage.setItem('costAppUserName', myName);
        localStorage.setItem('costAppMemberId', myMemberId);
      }catch(e){}
      document.getElementById('nameOverlay').style.display = 'none';
      updateUserBadge();
    }catch(e){
      console.error(e);
      errEl.textContent = '가입 중 오류가 발생했어요.';
    }
  }
  document.getElementById('signupSubmitBtn').addEventListener('click', attemptSignup);
  document.getElementById('signupPin').addEventListener('keydown', (e)=>{ if(e.key==='Enter') attemptSignup(); });

  document.getElementById('nameOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'nameOverlay' && myName){
      document.getElementById('nameOverlay').style.display = 'none';
    }
  });

  if(myName){
    updateUserBadge();
  }else{
    showLoginView();
    document.getElementById('nameOverlay').style.display = 'flex';
  }

  // ===== 상태 =====
  let data = { events: {} }; // { "YYYY-MM-DD": [{id, matQty, installFee, totalCost, createdBy}] }
  let viewDate = new Date();
  let selectedDateKey = '';

  const pad = n => String(n).padStart(2,'0');
  const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const isSameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();

  function startRealtimeSync(){
    if(!fbReady) return;
    db.collection('events').onSnapshot(snapshot=>{
      const newEvents = {};
      snapshot.forEach(docSnap=>{
        const d = docSnap.data();
        const ev = { id: docSnap.id, ...d };
        if(!newEvents[d.dateKey]) newEvents[d.dateKey] = [];
        newEvents[d.dateKey].push(ev);
      });
      data.events = newEvents;
      render();
    }, err=>{
      console.error('Firestore 동기화 오류', err);
      showConfigBanner('⚠️ Firestore에 연결하지 못했어요. Firestore Database와 보안 규칙을 확인해주세요.');
    });
  }
  async function addEntryDoc(entry){
    if(!fbReady) return;
    await db.collection('events').add(entry);
  }
  async function updateEntryDoc(id, entry){
    if(!fbReady) return;
    await db.collection('events').doc(id).update(entry);
  }
  async function deleteEntryDoc(id){
    if(!fbReady) return;
    await db.collection('events').doc(id).delete();
  }

  // ===== 달력 렌더링 =====
  const MONTH_NAMES = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

  function entryNetProfit(ev){
    return Number(ev.totalCost||0) - Number(ev.fuelCost||0) - Number(ev.miscCost||0);
  }
  function dayTotal(key){
    const evs = data.events[key] || [];
    return evs.reduce((sum,ev)=> sum + Number(ev.totalCost||0), 0);
  }
  function dayNetProfit(key){
    const evs = data.events[key] || [];
    return evs.reduce((sum,ev)=> sum + entryNetProfit(ev), 0);
  }

  function renderCalendar(){
    const y = viewDate.getFullYear();
    const m = viewDate.getMonth();
    document.getElementById('monthLabel').textContent = MONTH_NAMES[m];
    document.getElementById('yearLabel').textContent = y;

    // 이번 달 합계
    let monthTotal = 0, monthNetProfit = 0, monthCount = 0;
    for(const key in data.events){
      const parts = key.split('-').map(Number);
      if(parts[0] === y && (parts[1]-1) === m){
        data.events[key].forEach(ev=>{
          monthTotal += Number(ev.totalCost||0);
          monthNetProfit += entryNetProfit(ev);
          monthCount++;
        });
      }
    }
    document.getElementById('monthTotalValue').textContent = monthTotal.toLocaleString('ko-KR') + '원';
    document.getElementById('monthNetProfitValue').textContent = monthNetProfit.toLocaleString('ko-KR') + '원';
    document.getElementById('monthTotalCount').textContent = monthCount + '건';

    const firstDay = new Date(y, m, 1);
    const startOffset = firstDay.getDay();
    const gridStart = new Date(y, m, 1 - startOffset);

    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    const today = new Date();
    let rowEl = null;

    for(let i=0;i<42;i++){
      if(i % 7 === 0){
        rowEl = document.createElement('div');
        rowEl.className = 'grid-row';
        grid.appendChild(rowEl);
      }
      const cellDate = new Date(gridStart);
      cellDate.setDate(gridStart.getDate()+i);
      const key = dateKey(cellDate);
      const total = dayTotal(key);

      const cell = document.createElement('div');
      cell.className = 'cell';
      if(cellDate.getMonth() !== m) cell.classList.add('other-month');
      if(isSameDay(cellDate, today)) cell.classList.add('is-today');

      const dnum = document.createElement('div');
      dnum.className = 'cell-date';
      dnum.textContent = cellDate.getDate();
      cell.appendChild(dnum);

      if(total > 0){
        const costEl = document.createElement('div');
        costEl.className = 'cell-cost';
        costEl.textContent = total.toLocaleString('ko-KR')+'원';
        cell.appendChild(costEl);
      }

      cell.addEventListener('click', ()=> openDayOverlay(key, cellDate));
      rowEl.appendChild(cell);
    }
  }

  function render(){
    renderCalendar();
    if(document.getElementById('dayOverlay').style.display === 'flex' && selectedDateKey){
      renderDayEntries();
    }
  }

  // ===== 하루 상세 =====
  function openDayOverlay(key, dateObj){
    selectedDateKey = key;
    document.getElementById('dayTitle').textContent = `${dateObj.getMonth()+1}월 ${dateObj.getDate()}일`;
    renderDayEntries();
    document.getElementById('dayOverlay').style.display = 'flex';
  }
  function renderDayEntries(){
    const evs = (data.events[selectedDateKey] || []).slice();
    const total = evs.reduce((sum,ev)=> sum + Number(ev.totalCost||0), 0);
    const netProfit = evs.reduce((sum,ev)=> sum + entryNetProfit(ev), 0);
    document.getElementById('daySubTotal').innerHTML = `이 날 총 비용 ${total.toLocaleString('ko-KR')}원 · <span style="color:var(--profit); font-weight:700;">순이익 ${netProfit.toLocaleString('ko-KR')}원</span>`;

    const list = document.getElementById('dayEntryList');
    list.innerHTML = '';
    if(evs.length === 0){
      list.innerHTML = '<div class="empty-msg">이 날은 등록된 비용이 없어요.</div>';
      return;
    }
    evs.forEach(ev=>{
      const fuel = Number(ev.fuelCost||0);
      const misc = Number(ev.miscCost||0);
      const item = document.createElement('div');
      item.className = 'entry-item';
      item.innerHTML = `
        <div>
          <div class="entry-main">매트 ${ev.matQty||0}장 · 시공비 ${Number(ev.installFee||0).toLocaleString('ko-KR')}원</div>
          ${(fuel || misc) ? `<div class="entry-sub">주유비 ${fuel.toLocaleString('ko-KR')}원 · 기타 ${misc.toLocaleString('ko-KR')}원</div>` : ''}
          <div class="entry-sub">${escapeHtml(ev.createdBy||'-')}님 등록</div>
        </div>
        <div style="display:flex; align-items:center; gap:2px;">
          <div>
            <div class="entry-total mono" style="text-align:right;">${Number(ev.totalCost||0).toLocaleString('ko-KR')}원</div>
            <div class="mono" style="text-align:right; font-size:12.5px; color:var(--profit); font-weight:700; margin-top:2px;">순이익 ${entryNetProfit(ev).toLocaleString('ko-KR')}원</div>
          </div>
          ${ev.createdBy === myName ? `<button class="entry-del" data-id="${ev.id}" title="삭제">×</button>` : ''}
        </div>
      `;
      item.addEventListener('click', (e)=>{
        if(e.target.classList.contains('entry-del')) return;
        if(ev.createdBy === myName) openCostModal(ev);
      });
      list.appendChild(item);
    });
    list.querySelectorAll('.entry-del').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        e.stopPropagation();
        if(!confirm('이 비용 항목을 삭제할까요?')) return;
        try{ await deleteEntryDoc(btn.getAttribute('data-id')); }
        catch(err){ alert('삭제하지 못했어요. 잠시 후 다시 시도해주세요.'); }
      });
    });
  }
  document.getElementById('dayCloseX').addEventListener('click', ()=>{
    document.getElementById('dayOverlay').style.display = 'none';
  });
  document.getElementById('dayAddBtn').addEventListener('click', ()=> openCostModal(null));

  // ===== 비용 추가/수정 모달 =====
  let editingId = null;
  function updateCostTotalDisplay(){
    const qty = parseInt(document.getElementById('inpMatQty').value, 10) || 0;
    const fee = parseInt(document.getElementById('inpInstallFee').value, 10) || 0;
    const total = qty * MAT_UNIT_PRICE + fee;
    document.getElementById('costTotalDisplay').textContent = total.toLocaleString('ko-KR') + '원';
    updateNetProfitDisplay();
  }
  function updateNetProfitDisplay(){
    const qty = parseInt(document.getElementById('inpMatQty').value, 10) || 0;
    const fee = parseInt(document.getElementById('inpInstallFee').value, 10) || 0;
    const fuel = parseInt(document.getElementById('inpFuelCost').value, 10) || 0;
    const misc = parseInt(document.getElementById('inpMiscCost').value, 10) || 0;
    const total = qty * MAT_UNIT_PRICE + fee;
    const netProfit = total - fuel - misc;
    document.getElementById('netProfitDisplay').textContent = netProfit.toLocaleString('ko-KR') + '원';
  }
  document.getElementById('inpMatQty').addEventListener('input', updateCostTotalDisplay);
  document.getElementById('inpInstallFee').addEventListener('input', updateCostTotalDisplay);
  document.getElementById('inpFuelCost').addEventListener('input', updateNetProfitDisplay);
  document.getElementById('inpMiscCost').addEventListener('input', updateNetProfitDisplay);

  function openCostModal(ev){
    editingId = ev ? ev.id : null;
    document.getElementById('costModalTitle').textContent = ev ? '비용 수정' : '비용 추가';
    document.getElementById('costSaveBtn').textContent = ev ? '수정 완료' : '저장';
    const parts = selectedDateKey.split('-');
    document.getElementById('costModalDate').textContent = `${parseInt(parts[1],10)}월 ${parseInt(parts[2],10)}일`;
    document.getElementById('inpMatQty').value = ev ? (ev.matQty||0) : 0;
    document.getElementById('inpInstallFee').value = ev ? (ev.installFee!=null?ev.installFee:150000) : 150000;
    document.getElementById('inpFuelCost').value = ev ? (ev.fuelCost||0) : 0;
    document.getElementById('inpMiscCost').value = ev ? (ev.miscCost||0) : 0;
    updateCostTotalDisplay();
    document.getElementById('costOverlay').style.display = 'flex';
    setTimeout(()=>document.getElementById('inpMatQty').focus(), 50);
  }
  document.getElementById('costCloseX').addEventListener('click', ()=>{
    document.getElementById('costOverlay').style.display = 'none';
  });
  document.getElementById('costCancelBtn').addEventListener('click', ()=>{
    document.getElementById('costOverlay').style.display = 'none';
  });
  document.getElementById('costSaveBtn').addEventListener('click', async ()=>{
    if(!fbReady){
      alert('Firebase 연결 후 저장할 수 있어요.');
      return;
    }
    const matQty = parseInt(document.getElementById('inpMatQty').value, 10) || 0;
    const installFee = parseInt(document.getElementById('inpInstallFee').value, 10) || 0;
    const fuelCost = parseInt(document.getElementById('inpFuelCost').value, 10) || 0;
    const miscCost = parseInt(document.getElementById('inpMiscCost').value, 10) || 0;
    const totalCost = matQty * MAT_UNIT_PRICE + installFee;
    const netProfit = totalCost - fuelCost - miscCost;
    const btn = document.getElementById('costSaveBtn');
    btn.disabled = true;
    try{
      if(editingId){
        await updateEntryDoc(editingId, { matQty, installFee, fuelCost, miscCost, totalCost, netProfit });
      }else{
        await addEntryDoc({ dateKey: selectedDateKey, matQty, installFee, fuelCost, miscCost, totalCost, netProfit, createdBy: myName });
      }
      document.getElementById('costOverlay').style.display = 'none';
    }catch(e){
      console.error(e);
      alert('저장하지 못했어요. 잠시 후 다시 시도해주세요.');
    }
    btn.disabled = false;
  });

  // ===== 달력 네비게이션 =====
  document.getElementById('prevBtn').addEventListener('click', ()=>{
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()-1, 1);
    renderCalendar();
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 1);
    renderCalendar();
  });
  document.getElementById('todayBtn').addEventListener('click', ()=>{
    viewDate = new Date();
    renderCalendar();
  });

  renderCalendar();
  startRealtimeSync();
})();
</script>
</body>
</html>
